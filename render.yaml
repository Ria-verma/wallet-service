# Render Blueprint — deploy with "New → Blueprint" pointing at this repo.
# Only DATABASE_URL is prompted for (paste the Neon connection string);
# JWT_SECRET is generated by Render and never committed anywhere.
services:
  - type: web
    name: wallet-service
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_BALANCE_PAISE
        value: "100000"
